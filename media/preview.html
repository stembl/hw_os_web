<!DOCTYPE html>
<html>
<head><style>
body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
.card { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
.card.dark { background: #0D1520; }
.label { font-size: 12px; color: #666; margin-bottom: 8px; }
img { max-width: 100%; display: block; }
</style></head>
<body>
<div class="card"><div class="label">Light (default)</div>
<img src="diagram-1-hardware-os-stack.svg"></div>
<div class="card dark"><div class="label" style="color:#aaa">Dark</div>
<img src="diagram-1-hardware-os-stack-dark.svg"></div>
<div class="card"><div class="label">Black and White</div>
<img src="diagram-1-hardware-os-stack-bw.svg"></div>
<div class="card" style="background: repeating-linear-gradient(45deg,#ccc,#ccc 5px,#eee 5px,#eee 10px)"><div class="label">No background (checkerboard = transparent)</div>
<img src="diagram-1-hardware-os-stack-nobg.svg"></div>
</body></html>
