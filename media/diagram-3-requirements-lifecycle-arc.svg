<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
<rect width="100%" height="100%" fill="#f8fafc"/>
<defs>
  <marker id="arrowblue3" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#1e40af"/>
  </marker>
  <marker id="arrowamber" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#b45309"/>
  </marker>
  <marker id="arrowgray" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
  </marker>
</defs>
<text x="850.0" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">Requirements Lifecycle Arc</text>
<text x="850.0" y="106" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Requirements are managed hypotheses that cycle through evidence and controlled revision.</text>
<rect x="225.0" y="204.0" width="390" height="132" rx="22" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="420" y="248.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Hypothesis</text>
<text x="420" y="282.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">Value proposed; physics basis stated</text>
<rect x="925.0" y="204.0" width="390" height="132" rx="22" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="1120" y="248.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Blessed</text>
<text x="1120" y="282.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">Owner named; value approved; acceptance</text>
<text x="1120" y="305.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">method defined</text>
<rect x="925.0" y="584.0" width="390" height="132" rx="22" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="1120" y="628.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Evidence</text>
<text x="1120" y="662.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">Test or analysis result links to record</text>
<rect x="225.0" y="584.0" width="390" height="132" rx="22" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
<text x="420" y="628.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">Revise</text>
<text x="420" y="662.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">Evidence breaks assumption; controlled</text>
<text x="420" y="685.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">revision with DRI, rationale, downstream</text>
<text x="420" y="708.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">update</text>
<path d="M 620 270 C 760 185, 900 185, 920 270" fill="none" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue3)"/>
<text x="770" y="200" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">Owner + approval</text>
<path d="M 1120 340 C 1220 425, 1220 495, 1120 580" fill="none" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue3)"/>
<text x="1260" y="465" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">Test or analysis runs</text>
<path d="M 920 650 C 790 735, 660 735, 620 650" fill="none" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue3)"/>
<text x="770" y="745" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">Result breaks assumption</text>
<path d="M 420 580 C 300 495, 300 425, 420 340" fill="none" stroke="#b45309" stroke-width="6" marker-end="url(#arrowamber)"/>
<text x="245" y="465" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">New hypothesis entered</text>
<path d="M 1010 585 C 895 485, 895 435, 1010 335" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowgray)"/>
<text x="875" y="465" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">Assumption confirmed</text>
<rect x="1330" y="740" width="250" height="115" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1368" y="788" font-family="Inter, Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#dc2626" text-anchor="start">✕</text>
<text x="1422" y="782" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#991b1b" text-anchor="start">FROZEN</text>
<text x="1422" y="813" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#991b1b" text-anchor="start">but WRONG</text>
<path d="M 1230 650 C 1310 650, 1380 675, 1445 735" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowgray)"/>
<text x="1380" y="628" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">dead-end path</text>
<rect x="245" y="896" width="1210" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="850.0" y="944" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">“A requirement that cannot revise is not a hypothesis — it is a wish with a number.”</text>
</svg>