<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 740 344"
     width="740" height="344"
     role="img"
     aria-label="Requirements Lifecycle Arc">
  <rect width="740" height="344" fill="#FFFFFF"/>
  <text x="50" y="40" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="700" fill="#162447">Requirements Lifecycle Arc</text>
  <text x="50" y="64" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="400" fill="#4D6A8A">Four states in a controlled cycle — “Frozen but Wrong” when the loop breaks</text>
  <text x="200" y="84" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="10" font-weight="400" fill="#2E4A6E" text-anchor="middle" dominant-baseline="central">Sign-off</text>
  <text x="370" y="84" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="10" font-weight="400" fill="#2E4A6E" text-anchor="middle" dominant-baseline="central">Data attached</text>
  <text x="540" y="84" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="10" font-weight="400" fill="#2E4A6E" text-anchor="middle" dominant-baseline="central">Threshold</text>
  <rect x="50" y="102" width="130" height="64" fill="#1F4287" rx="4"/>
  <text x="115" y="134" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Hypothesis</text>
  <rect x="220" y="102" width="130" height="64" fill="#1F4287" rx="4"/>
  <text x="285" y="134" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Bless</text>
