<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 680 688"
     width="680" height="688"
     role="img"
     aria-label="DRI Decision Flow — Five duties — with escalation when criteria are not met">
  <rect width="680" height="688" fill="#FFFFFF"/>
  <text x="340" y="40" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="22" font-weight="700" fill="#162447" text-anchor="middle">DRI Decision Flow</text>
  <text x="340" y="64" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="400" fill="#4D6A8A" text-anchor="middle">Five duties — with escalation when criteria are not met</text>
  <rect x="105" y="86" width="300" height="60" fill="#1F4287" rx="4"/>
  <text x="255" y="116" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1. Frame the decision question</text>
  <line x1="255" y1="146" x2="255" y2="165" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,172 251.2,165 258.9,165" fill="#2E6BB0"/>
  <rect x="105" y="172" width="300" height="60" fill="#1F4287" rx="4"/>
  <text x="255" y="202" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2. Collect required inputs</text>
  <line x1="255" y1="232" x2="255" y2="251" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,258 251.2,251 258.9,251" fill="#2E6BB0"/>
  <rect x="105" y="258" width="300" height="60" fill="#1F4287" rx="4"/>
  <text x="255" y="288" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3. Propose a decision by date</text>
  <line x1="255" y1="318" x2="255" y2="337" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,344 251.2,337 258.9,337" fill="#2E6BB0"/>
  <polygon points="255,344 323,376 255,408 187,376" fill="#2E6BB0" stroke="none"/>
  <text x="255" y="376" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Criteria met?</text>
  <line x1="323" y1="376" x2="428" y2="376" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="435,376 428,372.1 428,379.9" fill="#2E6BB0"/>
  <text x="379" y="370" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="11" font-weight="700" fill="#2E4A6E" text-anchor="middle">NO</text>
  <rect x="435" y="346" width="180" height="60" fill="#4A5568" rx="4"/>
  <text x="525" y="376" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Escalate to lead</text>
  <line x1="255" y1="408" x2="255" y2="427" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,434 251.2,427 258.9,427" fill="#2E6BB0"/>
  <text x="263" y="421" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="11" font-weight="700" fill="#2E4A6E" dominant-baseline="central">YES</text>
  <rect x="105" y="434" width="300" height="60" fill="#1F4287" rx="4"/>
  <text x="255" y="464" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4. Record outcome and rationale</text>
  <line x1="255" y1="494" x2="255" y2="513" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,520 251.2,513 258.9,513" fill="#2E6BB0"/>
  <rect x="105" y="520" width="300" height="60" fill="#1F4287" rx="4"/>
  <text x="255" y="542" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5. Push updates into</text>
  <text x="255" y="560" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">   dependent artifacts</text>
  <rect x="105" y="606" width="300" height="60" fill="#162447" rx="4"/>
  <text x="255" y="636" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Decision closed</text>
  <line x1="255" y1="580" x2="255" y2="599" stroke="#2E6BB0" stroke-width="1.5"/>
  <polygon points="255,606 251.2,599 258.9,599" fill="#2E6BB0"/>
</svg>