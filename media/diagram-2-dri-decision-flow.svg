<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<rect width="100%" height="100%" fill="#f8fafc"/>
<defs>
  <marker id="arrowblue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#1e40af"/>
  </marker>
  <marker id="arroworange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#c2410c"/>
  </marker>
</defs>
<text x="850.0" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">DRI Decision Flow</text>
<text x="850.0" y="108" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">A controlled decision path with explicit escalation when criteria are not met.</text>
<rect x="110" y="230" width="220" height="92" rx="18" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="220.0" y="274.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Frame the question</text>
<line x1="330" y1="276.0" x2="410" y2="276.0" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue)"/>
<rect x="410" y="230" width="220" height="92" rx="18" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="520.0" y="274.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Collect required</text>
<text x="520.0" y="299.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">inputs</text>
<line x1="630" y1="276.0" x2="720.0" y2="276.0" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue)"/>
<polygon points="815,206.0 910.0,276.0 815,346.0 720.0,276.0" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
<text x="815" y="270.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Criteria met?</text>
<line x1="910.0" y1="276.0" x2="1020.0" y2="276.0" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue)"/>
<text x="954.0" y="260.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">Yes</text>
<rect x="1020.0" y="230" width="220" height="92" rx="18" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="1130.0" y="274.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Propose decision</text>
<path d="M 815 346.0 C 815 445, 830.0 395, 830.0 465" fill="none" stroke="#c2410c" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arroworange)"/>
<text x="833" y="386.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="start">No</text>
<rect x="720" y="465" width="220" height="92" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="830.0" y="509.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Escalation record</text>
<line x1="1130.0" y1="322" x2="1130.0" y2="405" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue)"/>
<rect x="1020.0" y="405" width="220" height="92" rx="18" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="1130.0" y="449.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Record outcome +</text>
<text x="1130.0" y="474.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">rationale</text>
<line x1="1130.0" y1="497" x2="1130.0" y2="580" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowblue)"/>
<rect x="1020.0" y="580" width="220" height="92" rx="18" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
<text x="1130.0" y="624.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Update downstream</text>
<text x="1130.0" y="649.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">artifacts</text>
<rect x="110" y="690" width="1480" height="185" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="142" y="735" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Five DRI duties</text>
<text x="142" y="774" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">1. Frame the question</text>
<text x="142" y="808" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">2. Collect required inputs</text>
<text x="142" y="842" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">3. Propose decision</text>
<text x="792" y="774" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">4. Record outcome + rationale</text>
<text x="792" y="808" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">5. Update downstream artifacts</text>
</svg>